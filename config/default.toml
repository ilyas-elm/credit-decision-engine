# Every threshold, split proportion and experiment parameter lives here.
# Changing a number is a config change with a one-line reason in the commit
# message -- never a silent edit to chase a better result.

# Kaggle CLI 2.x authenticates with a single OAuth/API token and stores no
# username, so the kernel id cannot be derived from the credentials and the
# username has to be stated. Not a secret (it is the public profile URL) but
# personal, so it ships empty; $KAGGLE_USERNAME overrides it.
[kaggle]
username = "ilyaselmaazouzi"

[data]
competition = "home-credit-credit-risk-model-stability"
sample_dir = "data/sample"
# Fraction of case_ids kept in the local development sample, stratified by
# (WEEK_NUM, target). Target size on disk is under 1 GB.
sample_fraction = 0.03
sample_seed = 20251013

# --- 1. Splits -------------------------------------------------------------
# Out-of-time by WEEK_NUM. Never random K-fold across time.
# Each held-out block has exactly one job; conformal calibration must see data
# that nothing else was fitted on, or its coverage guarantee is void.
[splits]
train_frac = 0.60       # model fitting
val_a_frac = 0.08       # early stopping and probability calibration
val_b_frac = 0.07       # conformal calibration ONLY
test_frac  = 0.25       # out-of-time evaluation, touched by nothing else

# --- 2a. Feature construction ---------------------------------------------
# Column names are the REAL ones, verified against the data (docs/DATA_NOTES.md).
[features]
# Payment history (credit_bureau_a_2) is monthly, so recency is weighted with a
# half-life in months: a payment 12 months before the decision counts half as
# much as one in the decision month.
recency_halflife_months = 12.0
# "count of DPD > 30 in the last 12 and 24 months", from the brief.
dpd_threshold = 30
dpd_windows_months = [12, 24]
# Inquiry counts already arrive pre-windowed in static_cb_0; these are the
# windows that exist, in days.
inquiry_windows_days = [30, 90, 180, 360]
# A file with fewer than this many bureau records is "thin".
thin_file_max_records = 3

# --- 2. Feature screening (fitted on train weeks only) ---------------------
[screening]
max_missing_rate = 0.95     # drop above this
psi_drop = 0.25             # drop above this
psi_flag = 0.10             # flag between psi_flag and psi_drop
leakage_gini = 0.50         # print univariate Gini above this for manual review
psi_bins = 10

# --- 3. Champion: scorecard ------------------------------------------------
# NOTE on min_iv, measured (tests/test_scorecard.py): IV is computed on the bins
# it chose, so it is biased upward, and the bias shrinks with n. Max IV over
# three pure-noise columns at an 8% event rate:
#   n=2,000 -> 0.0889 (4x ABOVE this floor) | n=10,000 -> 0.0117
#   n=50,000 -> 0.0034                      | n=200,000 -> 0.0006
# So 0.02 screens noise against the full ~900k train rows but NOT on the 3%
# local sample. Feature-selection decisions belong to the full-data run; the
# local sample is for making the code work, not for deciding which features live.
[scorecard]
monotonic_trend = "auto_asc_desc"
min_iv = 0.02               # keep features at or above this IV
max_abs_corr = 0.80         # for pairs above this, keep the higher-IV feature

# Characteristics barred from the scorecard because their fitted coefficient
# INVERTS their univariate relationship: points rise as the event rate rises, so
# the table reads "the more you previously borrowed, the safer you are". Credit
# model review rejects that, and the champion exists to be the readable model.
#
# The cause is joint collinearity in the previous-applications family, not any
# one characteristic: pairwise pruning at 0.80 still leaves a cluster correlated
# 0.60-0.78 (condition number 15.1), and excluding one flip simply moves it to
# the next. Four have to go to clear it.
#
# MEASURED COST, full data, test weeks: Gini 0.3956 -> 0.3944 and stability
# 0.3604 -> 0.3594, for 16 characteristics down to 13. About 0.3% relative --
# a readable scorecard is worth that.
#
# Applies to select_features only, so it governs the champion. The sampling-bias
# experiment passes its features explicitly and is deliberately unaffected: its
# ranking must come from the policy weeks alone.
excluded_characteristics = [
    "prev_amount_mean",
    "prev_amount_max",
    "prev_amount_total",
    "prev_n_applications",
]
scaling_method = "pdo_odds"
points_at_odds = 600.0
target_odds = 50.0          # 50:1 good:bad
pdo = 20.0

# --- 4. Challenger: LightGBM ----------------------------------------------
# Fixed, sensible parameters. No class rebalancing anywhere in this project.
[challenger]
n_estimators = 2000
learning_rate = 0.03
num_leaves = 31
min_child_samples = 200
feature_fraction = 0.7
bagging_fraction = 0.8
bagging_freq = 1
lambda_l2 = 10.0
early_stopping_rounds = 100
seed = 20251013
optuna_trials = 0           # <= 30 if ever enabled; 0 means fixed params only

# --- 5. Profit / EMP assumptions ------------------------------------------
# Parameter meanings are empulse's, verified against empcs_score's docstring and
# behaviour -- not guessed:
#   success_rate : probability the loan is paid back IN FULL
#   default_rate : probability the ENTIRE loan is lost
#   1 - success_rate - default_rate : uniform distribution of PARTIAL losses
#   roi          : return on investment on a loan that is repaid
# so success_rate + default_rate must not exceed 1.
#
# The centre point is the Verbraken et al. (2014) default used by empulse. These
# are ASSUMPTIONS, not measurements: evaluation reports the sensitivity grid
# rather than a single headline number.
#
# ENCODING, verified empirically (tests/test_profit.py): empcs_score expects the
# DEFAULT class as 1 -- the same encoding as the Home Credit `target` column --
# and y_score as the predicted PD. Pass `target` through untouched. Inverting it
# makes the metric blind (an informative model and pure noise both score ~0.2557)
# while returning a LARGER number, so the mistake flatters itself.
[profit]
success_rate = 0.55
default_rate = 0.10
roi = 0.2644
# WIDENED after measuring the break-even bad rate on the full data. A loan is
# profitable in expectation while p(default) < roi / (roi + E[loss]). At the
# centre point that break-even is 49.0%, against a book that defaults at 3.1%:
# approving everyone is optimal, EMPCS is 0, and no cutoff binds. The original
# grid (success 0.45-0.65, default 0.05-0.20, roi 0.20-0.32) had a lowest
# break-even of 34.8%, still 15x the real bad rate, so the whole sensitivity
# analysis was degenerate and could not answer "where should the cutoff sit".
#
# The grid now spans thin-margin, high-loss-given-default credit as well, down
# to a 2.2% break-even, so it brackets the rate at which a cutoff starts to pay.
# The centre point is UNCHANGED and still the literature's, so the headline
# number stays comparable -- the degeneracy there is a result, not something to
# tune away.
[profit.sensitivity]
success_rate = [0.05, 0.25, 0.55]
default_rate = [0.10, 0.45, 0.80]
roi = [0.02, 0.10, 0.2644]

# --- 6. Decision layer ----------------------------------------------------
[decision]
# Mondrian (class-conditional) split conformal, calibrated on val B weeks only.
conformal_alpha = 0.10
# Cost of one manual review, in the same units as profit. Swept in the figure.
review_cost = 0.01
review_cost_grid = [0.0, 0.005, 0.01, 0.02, 0.05]
# Characteristics a declined applicant could plausibly change, named from the
# real feature set. Everything here is a property of THIS application or of
# behaviour the applicant still controls:
#   afford_credit_to_taxincome   ask for a smaller loan
#   afford_annuity_to_taxincome  smaller loan, or a longer term
#   inq_last30d / inq_last90d    stop shopping for credit and wait
#
# Deliberately EXCLUDED, though several are among the strongest predictors:
#   delq_*            past delinquency. It happened; it cannot be unhappened.
#   prev_*rejected    prior rejection history, likewise.
#   bureau_*          file depth, which is time served, not a choice.
#   afford_taxincome_total  "earn more" is not recourse anyone can act on by
#                     Tuesday, and offering it would be a glib non-answer.
# These still appear in the principal reasons: an explanation that hid the real
# drivers to keep the advice tidy would be the dishonest version.
actionable_features = [
    "afford_credit_to_taxincome",
    "afford_annuity_to_taxincome",
    "inq_last30d",
    "inq_last90d",
]

# --- 7. Sampling-bias experiment ------------------------------------------
# Separate windows from [splits] on purpose: this experiment needs its own
# policy-fitting period that the main model never sees as a split boundary.
[sampling_bias]
policy_frac = 0.25          # fit the "old policy" scorecard
dev_frac = 0.45             # apply the policy, hide the rejects' labels
test_frac = 0.30            # full population with all labels: the ground truth
reject_rates = [10, 20, 30, 50]
# Features: top N by IV and LightGBM gain, computed on POLICY weeks only.
# Reusing the main model's ranking would leak the labels this experiment hides.
n_features = 40
dev_subsample = 150_000
n_trees = 400               # fixed for every arm: no early stopping, no tuning
seeds = [0, 1, 2]
parcelling_uplift = [1.5, 2.0]      # A4
exploration_pct = [1, 2, 5]         # A6, random approvals; weight is 100/p
self_learning_iters = 5             # A5
self_learning_confidence = 0.05     # add rejects scored outside this band
