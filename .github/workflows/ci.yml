name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. The job only reads the repository: it needs no write access
# and references no secrets, so the token it gets should be able to do nothing
# else. This repo is public, which means anyone can open a pull request and have
# this workflow run their code -- with a read-only token and no secrets, the
# blast radius of that is compute and nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A bootstrap interpreter only. uv reads requires-python from pyproject
      # and fetches the project's own 3.13 if this one does not match. 3.13 is
      # the Kaggle image's Python, measured by kaggle/env-probe.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Installed from PyPI rather than through a third-party action, so the
      # version that runs here is the one pinned in the lock file's resolver.
      - name: Install uv
        run: python -m pip install --upgrade uv

      # --frozen fails if uv.lock has drifted from pyproject.toml, which is the
      # point: a fresh clone must install exactly what was committed.
      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # Tests run against generated fixtures only. Competition data is never
      # committed, so CI never needs Kaggle credentials.
      - name: Test
        run: uv run pytest -q
